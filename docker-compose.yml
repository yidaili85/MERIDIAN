services:
  meridian:
    build: .
    image: meridian-store:latest
    container_name: meridian
    restart: unless-stopped
    # 只绑定本机，公网访问请走 Nginx/Caddy 反代 + HTTPS
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - meridian-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  meridian-data:
